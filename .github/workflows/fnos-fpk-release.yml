name: 发布 MDCz fnOS 应用包

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mdcz-fnos-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 启用 corepack
        run: corepack enable

      - name: 读取版本
        id: version
        run: |
          version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' fpk/manifest | head -n 1 | tr -d ' \r')
          [ -n "$version" ] || { echo "manifest 缺少 version" >&2; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: 构建 fpk
        run: bash fpk/scripts/build-fpk.sh

      - name: 模拟生命周期
        run: bash fpk/scripts/simulate-lifecycle.sh

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          fpk="dist/mdcz-${VERSION}.fpk"
          [ -f "$fpk" ] || { echo "找不到 $fpk" >&2; exit 1; }
          sha=$(sha256sum "$fpk" | awk '{ print $1 }')
          printf '%s  %s\n' "$sha" "$(basename "$fpk")" >"dist/mdcz-${VERSION}.fpk.sha256"
          notes=$(mktemp)
          cat >"$notes" <<EOF
          - 基于 MDCz ${VERSION} 官方非 Docker 发行包，使用飞牛应用中心的 Node.js 24 原生运行，不使用 Docker
          - 支持应用中心安装、启动、停止、重启、升级、卸载，崩溃后由内置守护进程自动拉起
          - 数据（配置、数据库、缓存、日志、备份）保存在「应用文件 → mdcz」，升级/卸载默认保留
          - 升级前自动备份数据库与配置；Web 端口可在应用设置中修改

          sha256: \`${sha}\`
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$fpk" "dist/mdcz-${VERSION}.fpk.sha256" --clobber
            gh release edit "$tag" --title "MDCz ${VERSION} 飞牛原生版" --notes-file "$notes"
          else
            gh release create "$tag" "$fpk" "dist/mdcz-${VERSION}.fpk.sha256" \
              --title "MDCz ${VERSION} 飞牛原生版" \
              --notes-file "$notes"
          fi
